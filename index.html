<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#651c32" />
    <meta
      name="description"
      content="Explore the Romae menu, customise a pizza and prepare your pickup or dine-in order."
    />
    <title>Romae — Menu & pizza studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header">
      <div class="header-inner">
        <a href="#menu" class="brand" aria-label="Romae menu"
          >Romae<span>PIZZERIA</span></a
        >
        <nav aria-label="Main navigation">
          <a href="#menu">Menu</a><a href="#orders">Orders</a
          ><a href="#account">Account</a><a href="#help">Help</a>
        </nav>
        <a
          href="#cart"
          class="bag"
          id="header-bag"
          aria-label="Your order, 0 items"
          ><span aria-hidden="true">Bag</span><span id="bag-count">0</span></a
        >
      </div>
    </header>
    <div id="app"></div>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button
          class="icon-button"
          id="close-sheet"
          aria-label="Close item options"
        >
          ×
        </button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-copy"></span><button id="undo" hidden>Undo</button>
    </div>
    <noscript
      ><p class="empty">
        Turn on JavaScript to build your pizza and manage your order.
      </p></noscript
    >
    <script type="module" src="app.mjs"></script>
  </body>
</html>
